# Automatically merge Dependabot PRs when the update is within the range
# configured in .github/auto-merge.yml

name: Auto-Merge Dependabot PRs

on:
  # WARNING: This runs in the PR base, DO NOT build untrusted code in this workflow
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Dependabot PRs
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
